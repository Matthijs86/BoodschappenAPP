<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#3d8bfd">

    <title>Mijn Boodschappenlijst</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="app">

        <h1>🛒 Mijn Boodschappenlijst</h1>


        <!-- ==========================
             WINKEL KIEZEN
        =========================== -->

        <section class="winkel-sectie">

            <h2>🏪 Winkel</h2>

            <div class="winkel-knoppen">

                <button
                    class="winkel-knop"
                    data-winkel="Albert Heijn"
                >
                    🟦 Albert Heijn
                </button>

                <button
                    class="winkel-knop"
                    data-winkel="Aldi"
                >
                    🟩 Aldi
                </button>

                <button
                    class="winkel-knop"
                    data-winkel="Toko"
                >
                    🌶️ Toko
                </button>

                <button
                    class="winkel-knop"
                    data-winkel="Jumbo"
                >
                    🟨 Jumbo
                </button>

                <button
                    class="winkel-knop"
                    data-winkel="Lidl"
                >
                    🔵 Lidl
                </button>

            </div>

            <button
                id="alleWinkelsKnop"
                class="alle-winkels-knop actief"
            >
                🛒 Alle winkels
            </button>

        </section>


        <!-- ==========================
             INVOER
        =========================== -->

        <div class="invoer">

            <input
                type="number"
                id="aantalInput"
                value="1"
                min="1"
                step="1"
                placeholder="Aantal"
            >

            <select id="eenheidInput">

                <option value="st">
                    stuks
                </option>

                <option value="g">
                    gram
                </option>

                <option value="ml">
                    ml
                </option>

            </select>

            <input
                type="text"
                id="productInput"
                placeholder="Bijvoorbeeld: Melk"
                autocomplete="off"
            >

            <button id="toevoegen">
                ➕ Toevoegen
            </button>

        </div>


        <!-- ==========================
             GESELECTEERDE WINKEL
        =========================== -->

        <div
            id="gekozenWinkel"
            class="gekozen-winkel"
        >
            🛒 Alle winkels
        </div>


        <!-- ==========================
             BOODSCHAPPEN
        =========================== -->

        <ul id="boodschappenLijst"></ul>


        <p id="legeLijst">
            Je boodschappenlijst is nog leeg.
        </p>


        <!-- ==========================
             ALLES WISSEN
        =========================== -->

        <button id="allesWissen">
            🗑️ Alles wissen
        </button>


        <!-- ==========================
             FOOTER
        =========================== -->

        <div class="footer">
            Made by Matthijs Karst Boersma
        </div>

    </main>


    <script src="./script.js"></script>


    <!-- ==========================
         SERVICE WORKER
    =========================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register("./service-worker.js")
                        .then(
                            registration => {

                                console.log(
                                    "Service Worker actief:",
                                    registration.scope
                                );

                            }
                        )
                        .catch(
                            error => {

                                console.error(
                                    "Service Worker fout:",
                                    error
                                );

                            }
                        );

                }
            );

        }

    </script>

</body>

</html>
