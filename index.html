<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <meta
        name="theme-color"
        content="#3d8bfd"
    >

    <title>Mijn Boodschappenlijst</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <main class="app">

        <!-- ==========================
             TITEL
        =========================== -->

        <h1>
            🛒 Mijn Boodschappenlijst
        </h1>


        <!-- ==========================
             INVOER
        =========================== -->

        <div class="invoer">

            <!-- AANTAL -->

            <input
                type="number"
                id="aantalInput"
                value="1"
                min="1"
                step="1"
                placeholder="Aantal"
            >


            <!-- EENHEID -->

            <select id="eenheidInput">

                <option value="st">
                    stuks
                </option>

                <option value="g">
                    gram
                </option>

                <option value="ml">
                    ml
                </option>

            </select>


            <!-- PRODUCT -->

            <input
                type="text"
                id="productInput"
                placeholder="Bijvoorbeeld: Melk"
                autocomplete="off"
            >


            <!-- WINKEL -->

            <select id="winkelInput">

                <option value="Albert Heijn">
                    🛒 Albert Heijn
                </option>

                <option value="Aldi">
                    🛒 Aldi
                </option>

                <option value="Toko">
                    🏮 Toko
                </option>

                <option value="Jumbo">
                    🛒 Jumbo
                </option>

                <option value="Lidl">
                    🛒 Lidl
                </option>

            </select>


            <!-- TOEVOEGEN -->

            <button id="toevoegen">
                + Toevoegen
            </button>

        </div>


        <!-- ==========================
             BOODSCHAPPENLIJST
        =========================== -->

        <div id="boodschappenLijst"></div>


        <!-- ==========================
             LEGE LIJST
        =========================== -->

        <p id="legeLijst">

            Je boodschappenlijst is nog leeg.

        </p>


        <!-- ==========================
             ALLES WISSEN
        =========================== -->

        <button id="allesWissen">

            🗑️ Alles wissen

        </button>


        <!-- ==========================
             FOOTER
        =========================== -->

        <div class="footer">

            Made by Matthijs Karst Boersma

        </div>

    </main>


    <!-- ==========================
         JAVASCRIPT
    =========================== -->

    <script src="./script.js"></script>


    <!-- ==========================
         SERVICE WORKER
    =========================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register("./service-worker.js")
                        .then(registration => {

                            console.log(
                                "Service Worker actief:",
                                registration.scope
                            );

                        })
                        .catch(error => {

                            console.error(
                                "Service Worker fout:",
                                error
                            );

                        });

                }
            );

        }

    </script>

</body>

</html>
