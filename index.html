<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#3d8bfd"
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <title>Mijn Boodschappenlijst</title>

</head>


<body>


<main class="app">


    <!-- ==========================
         TITEL
    =========================== -->

    <h1>
        🛒 Mijn Boodschappenlijst
    </h1>


    <!-- ==========================
         INVOER
    =========================== -->

    <div class="invoer">


        <!-- AANTAL -->

        <input
            type="number"
            id="aantalInput"
            value="1"
            min="1"
            step="1"
            placeholder="Aantal"
            aria-label="Aantal"
        >


        <!-- EENHEID -->

        <select
            id="eenheidInput"
            aria-label="Eenheid"
        >

            <option value="st">
                stuks
            </option>

            <option value="g">
                gram
            </option>

            <option value="ml">
                ml
            </option>

        </select>


        <!-- PRODUCT -->

        <input
            type="text"
            id="productInput"
            placeholder="Bijvoorbeeld: Melk"
            autocomplete="off"
            aria-label="Product"
        >


        <!-- WINKEL -->

        <select
            id="winkelInput"
            aria-label="Winkel"
        >

            <option value="Albert Heijn">
                🛒 Albert Heijn
            </option>

            <option value="Aldi">
                🟦 Aldi
            </option>

            <option value="Toko">
                🌶️ Toko
            </option>

            <option value="Jumbo">
                🟡 Jumbo
            </option>

            <option value="Lidl">
                🔵 Lidl
            </option>

        </select>


        <!-- TOEVOEGEN -->

        <button
            id="toevoegen"
            type="button"
        >
            ➕ Toevoegen
        </button>


    </div>


    <!-- ==========================
         BOODSCHAPPEN
    =========================== -->

    <div
        id="winkelsContainer"
        class="winkels-container"
    ></div>


    <!-- ==========================
         LEGE LIJST
    =========================== -->

    <p id="legeLijst">

        Je boodschappenlijst is nog leeg.

    </p>


    <!-- ==========================
         ALLES WISSEN
    =========================== -->

    <button
        id="allesWissen"
        type="button"
    >
        🗑️ Alles wissen
    </button>

</main>


<script src="./script.js"></script>


<!-- ==========================
     SERVICE WORKER
=========================== -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register(
                    "./service-worker.js"
                )
                .then(
                    registration => {

                        console.log(
                            "Service Worker actief:",
                            registration.scope
                        );

                    }
                )
                .catch(
                    error => {

                        console.error(
                            "Service Worker fout:",
                            error
                        );

                    }
                );

        }
    );

}

</script>


</body>

</html>
